<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Law Lab{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ prefix }}/static/logo.svg">
  <script>
    // Apply a saved light/dark choice before the page paints, so it never flashes the
    // other theme. With no saved choice the stylesheet follows the system setting.
    try {
      const t = localStorage.getItem('ailawlab-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ prefix }}/static/style.css?v={{ asset_version }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ prefix }}/" title="About AI Law Lab">
      <svg class="logo" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" class="logo-bg"/>
        <g class="logo-mark" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 8.5V24M11 24.5h10M7.5 11h17"/>
          <path d="M7.5 11 4.8 17.5M7.5 11l2.7 6.5M24.5 11l-2.7 6.5M24.5 11l2.7 6.5"/>
          <path d="M4.3 17.5a3.4 3.4 0 0 0 6.4 0zM21.3 17.5a3.4 3.4 0 0 0 6.4 0z" class="logo-fill"/>
        </g>
        <circle cx="16" cy="7" r="2.3" class="logo-node"/>
        <circle cx="7.5" cy="11" r="1.35" class="logo-node"/>
        <circle cx="24.5" cy="11" r="1.35" class="logo-node"/>
      </svg>
      <span>AI&nbsp;Law&nbsp;Lab</span>
    </a>
    <nav class="tabs" aria-label="Main">
      <a href="{{ prefix }}/sources" {% if active == 'sources' %}class="active" aria-current="page"{% endif %}>Legal Sources</a>
      <a href="{{ prefix }}/experiments/new" {% if active == 'new' %}class="active" aria-current="page"{% endif %}>New experiment</a>
      <a href="{{ prefix }}/dashboard" {% if active == 'dashboard' %}class="active" aria-current="page"{% endif %}>Dashboard</a>
    </nav>
    <span class="cluster-pill" id="cluster-pill" title="Inference cluster">&hellip;</span>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme">
      <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
    </button>
  </header>

  <main>
    {% block crumbs %}{% endblock %}
    {% block content %}{% endblock %}
  </main>

  <script>
    // Light/dark switch. The effective theme is the saved choice, else the system's.
    (function () {
      const root = document.documentElement, btn = document.getElementById('theme-toggle');
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const current = () => root.dataset.theme || (media.matches ? 'dark' : 'light');
      function label() {
        const next = current() === 'dark' ? 'light' : 'dark';
        btn.setAttribute('aria-label', `Switch to ${next} theme`);
        btn.title = `Switch to ${next} theme`;
      }
      btn.addEventListener('click', () => {
        root.dataset.theme = current() === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('ailawlab-theme', root.dataset.theme); } catch (e) {}
        label();
      });
      media.addEventListener('change', label);
      label();
    })();

    // Live cluster capacity in the header: free slots is the number that matters when
    // deciding whether to launch another run right now.
    async function refreshCluster() {
      try {
        const r = await fetch('{{ prefix }}/api/cluster');
        const d = await r.json();
        const healthy = d.hosts.filter(h => h.healthy);
        const free = healthy.reduce((a, h) => a + h.free_slots, 0);
        const pill = document.getElementById('cluster-pill');
        pill.textContent = `${healthy.length}/${d.hosts.length} hosts · ${free}/${d.total_slots} slots free`;
        pill.className = 'cluster-pill ' + (healthy.length === d.hosts.length ? 'ok' : 'warn');
      } catch (e) {
        const pill = document.getElementById('cluster-pill');
        pill.textContent = 'cluster unreachable';
        pill.className = 'cluster-pill bad';
      }
    }
    refreshCluster();
    setInterval(refreshCluster, 5000);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
