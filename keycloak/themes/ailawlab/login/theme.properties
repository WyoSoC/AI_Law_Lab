# The AI Law Lab's sign-in pages: Keycloak's own (keycloak.v2), with UW sign-on first and an
# AI Law Lab account below it (login.ftl), a link for people outside UW to request an account,
# and the terms acknowledgement in small print below the sign-in box (footer.ftl).
parent=keycloak.v2
import=common/keycloak
# Keycloak serves theme files at the same address after every change and lets browsers keep
# them for 30 days, so the version tag on ailawlab.css must change whenever that file does,
# or people keep seeing the old styles.
styles=css/styles.css css/ailawlab.css?v=2026-11-05b
